name: Test suite
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop, dependabot ]
  workflow_dispatch:

env:
  TEST_SIGNING_URL: "http://127.0.0.1:5000/sign"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [ 22, 24, 26 ]

    name: Node.js ${{ matrix.node }}

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node }}

    - name: Install mkcert
      run: |
        sudo apt-get update
        sudo apt-get install -y mkcert libnss3-tools

    - name: Set browser install directory
      run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: npm install

    - name: Install Chromium dependencies
      run: npx playwright install --with-deps chromium

    - name: Allow Chromium sandbox user namespaces
      # Ubuntu restricts user namespaces for downloaded browsers. Allow only the
      # installed Playwright executables so Chromium can create its sandbox.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      shell: bash
      run: |
        mapfile -d '' browsers < <(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \( -name chrome -o -name chrome-headless-shell \) -print0)
        test "${#browsers[@]}" -gt 0
        profile="$RUNNER_TEMP/playwright-apparmor"
        printf 'abi <abi/4.0>,\ninclude <tunables/global>\n' > "$profile"
        for index in "${!browsers[@]}"; do
          printf 'profile playwright-%s "%s" flags=(unconfined) {\n  userns,\n}\n' "$index" "${browsers[$index]}" >> "$profile"
        done
        sudo install -m 644 "$profile" /etc/apparmor.d/playwright
        sudo apparmor_parser -r /etc/apparmor.d/playwright

    - name: Check sandboxed Chromium
      timeout-minutes: 1
      env:
        DEBUG: pw:browser
      run: |
        node --input-type=module <<'NODE'
        import { chromium } from 'playwright'
        const browser = await chromium.launch({ chromiumSandbox: true, timeout: 15000 })
        await browser.close()
        NODE

    - name: Run signer
      run: |
        cd .services/signer/
        bash ./run.sh &
        sleep 5

    - name: Run tests
      timeout-minutes: 5
      run: npm run test
